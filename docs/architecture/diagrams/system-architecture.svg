<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">DoodleStory 当前系统架构</title>
  <desc id="desc">浏览器经 FastAPI 操作数据库和 Native Agent 运行时；运行时由进程内队列调度，通过工具调用媒体、研究、发布和存储服务。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#101a2e"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12395a"/><stop offset="1" stop-color="#174a58"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
    <style>
      .title{font:700 31px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#f8fafc}.subtitle{font:400 15px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#94a3b8}.group{fill:#0b1527;stroke:#2a3b54;stroke-width:1.2}.groupAgent{fill:url(#agent);stroke:#38bdf8;stroke-width:1.5}.card{fill:#122037;stroke:#34506c;stroke-width:1.2}.cardStrong{fill:#12324b;stroke:#38bdf8;stroke-width:1.4}.cardWarm{fill:#312414;stroke:#f59e0b;stroke-width:1.3}.cardGreen{fill:#123429;stroke:#4ade80;stroke-width:1.3}.label{font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#e2e8f0}.small{font:400 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#cbd5e1}.tiny{font:400 11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#94a3b8}.edge{fill:none;stroke:#7dd3fc;stroke-width:2;marker-end:url(#arrow)}.edgeMuted{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#arrowMuted)}.edgeWarm{fill:none;stroke:#fbbf24;stroke-width:2;marker-end:url(#arrowMuted)}.pill{fill:#0f2238;stroke:#315575;stroke-width:1}.pillText{font:600 11px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#bae6fd}
    </style>
  </defs>
  <rect width="1600" height="1020" fill="url(#bg)"/>
  <text x="56" y="62" class="title">DoodleStory：当前运行架构</text>
  <text x="56" y="91" class="subtitle">以 Native / Durable Agent 主链路为中心；传统任务链路仍存在，但不是新增 Agent 的推荐扩展入口</text>

  <g filter="url(#shadow)">
    <rect x="48" y="138" width="226" height="612" rx="18" class="group"/>
    <text x="72" y="174" class="label">使用者与界面</text>
    <rect x="72" y="204" width="178" height="96" rx="12" class="card"/>
    <text x="92" y="239" class="label">浏览器</text><text x="92" y="264" class="small">React + Vite 工作台</text><text x="92" y="284" class="tiny">Agent、任务、频道管理</text>
    <rect x="72" y="338" width="178" height="106" rx="12" class="card"/>
    <text x="92" y="373" class="label">人工决策</text><text x="92" y="398" class="small">确认 / 退回 / 取消</text><text x="92" y="418" class="tiny">外部副作用前的 Gate</text>
    <rect x="72" y="482" width="178" height="106" rx="12" class="card"/>
    <text x="92" y="517" class="label">实时视图</text><text x="92" y="542" class="small">REST + SSE 事件流</text><text x="92" y="562" class="tiny">刷新后以数据库投影收敛</text>

    <rect x="320" y="138" width="248" height="612" rx="18" class="group"/>
    <text x="344" y="174" class="label">应用边界</text>
    <rect x="344" y="204" width="200" height="122" rx="12" class="cardStrong"/>
    <text x="364" y="240" class="label">FastAPI /api/v1</text><text x="364" y="266" class="small">认证、资源、任务、Agent</text><text x="364" y="287" class="tiny">/agent-loop · /youtube</text><text x="364" y="307" class="tiny">生产时同时托管前端 dist</text>
    <rect x="344" y="370" width="200" height="118" rx="12" class="card"/>
    <text x="364" y="406" class="label">路由与权限</text><text x="364" y="431" class="small">owner / admin 校验</text><text x="364" y="452" class="tiny">版本固定、审批命令、资源引用</text>
    <rect x="344" y="532" width="200" height="118" rx="12" class="card"/>
    <text x="364" y="568" class="label">启动恢复</text><text x="364" y="593" class="small">数据库单实例锁</text><text x="364" y="614" class="tiny">初始化队列并恢复合法 Run</text>

    <rect x="616" y="138" width="382" height="612" rx="18" class="groupAgent"/>
    <text x="640" y="174" class="label">Native / Durable Agent Runtime</text>
    <rect x="640" y="204" width="334" height="110" rx="12" class="cardStrong"/>
    <text x="661" y="240" class="label">Run + Skill Version 快照</text><text x="661" y="265" class="small">会话、上下文、计划、Gate、Artifact</text><text x="661" y="286" class="tiny">状态先持久化，再产生可恢复执行</text>
    <rect x="640" y="350" width="154" height="140" rx="12" class="card"/>
    <text x="660" y="386" class="label">进程内 Worker</text><text x="660" y="411" class="small">asyncio Queue</text><text x="660" y="432" class="tiny">单实例调度</text><text x="660" y="454" class="tiny">取消 / 重启恢复</text>
    <rect x="820" y="350" width="154" height="140" rx="12" class="cardStrong"/>
    <text x="840" y="386" class="label">Agent Loop</text><text x="840" y="411" class="small">Responses + Tools</text><text x="840" y="432" class="tiny">模型循环与流式事件</text><text x="840" y="454" class="tiny">Tool 并发受控</text>
    <rect x="640" y="530" width="334" height="120" rx="12" class="cardGreen"/>
    <text x="661" y="566" class="label">Function Tool 运行时</text><text x="661" y="591" class="small">图像、检查、语音、字幕、视频、素材、频道研究、发布</text><text x="661" y="613" class="tiny">Tool Call ID 幂等、效果 / 失败 / 事件均落库</text>

    <rect x="1046" y="138" width="232" height="612" rx="18" class="group"/>
    <text x="1070" y="174" class="label">权威状态与资产</text>
    <rect x="1070" y="204" width="184" height="155" rx="12" class="card"/>
    <text x="1090" y="240" class="label">SQLAlchemy 数据库</text><text x="1090" y="266" class="small">Conversation / Run / Step</text><text x="1090" y="288" class="small">Event / Artifact / Gate</text><text x="1090" y="310" class="small">频道 / 发布任务</text><text x="1090" y="334" class="tiny">SQLite 或配置的数据库</text>
    <rect x="1070" y="402" width="184" height="116" rx="12" class="cardGreen"/>
    <text x="1090" y="438" class="label">资产存储</text><text x="1090" y="463" class="small">Local / Qiniu / OSS</text><text x="1090" y="484" class="tiny">图片、音频、字幕、视频、素材</text>
    <rect x="1070" y="561" width="184" height="89" rx="12" class="card"/>
    <text x="1090" y="597" class="label">观测</text><text x="1090" y="622" class="small">MLflow（可选）</text>

    <rect x="1326" y="138" width="226" height="612" rx="18" class="group"/>
    <text x="1350" y="174" class="label">工具与外部边界</text>
    <rect x="1350" y="204" width="178" height="116" rx="12" class="cardWarm"/>
    <text x="1370" y="240" class="label">模型与媒体</text><text x="1370" y="265" class="small">Responses 模型 / 生图</text><text x="1370" y="286" class="small">火山 TTS / 本地 Whisper</text><text x="1370" y="307" class="tiny">Remotion、ffmpeg、grokcli</text>
    <rect x="1350" y="364" width="178" height="116" rx="12" class="cardWarm"/>
    <text x="1370" y="400" class="label">内容与研究</text><text x="1370" y="425" class="small">同级多平台导入服务</text><text x="1370" y="446" class="tiny">微信素材、YouTube 频道洞察</text>
    <rect x="1350" y="524" width="178" height="126" rx="12" class="cardWarm"/>
    <text x="1370" y="560" class="label">YouTube 发布平台</text><text x="1370" y="585" class="small">video.inboxlinks.top</text><text x="1370" y="606" class="tiny">创建 / 查询异步上传任务</text><text x="1370" y="627" class="tiny">不是 DoodleStory 直连 YouTube SDK</text>
  </g>

  <path d="M250 252 H344" class="edge"/><text x="275" y="237" class="tiny">请求</text>
  <path d="M250 535 H320 V286 H344" class="edgeMuted"/><text x="273" y="516" class="tiny">SSE</text>
  <path d="M544 265 H640" class="edge"/><text x="565" y="250" class="tiny">创建 Run</text>
  <path d="M544 430 H590 V582 H640" class="edgeMuted"/><text x="563" y="563" class="tiny">权限 / 命令</text>
  <path d="M794 420 H820" class="edge"/>
  <path d="M974 259 H1070" class="edge"/><text x="1001" y="244" class="tiny">读写状态</text>
  <path d="M974 590 H1020 V460 H1070" class="edge"/><text x="995" y="575" class="tiny">保存产物</text>
  <path d="M974 590 H1302 V260 H1350" class="edgeWarm"/><text x="1135" y="574" class="tiny">调用工具 / Provider</text>
  <path d="M1254 460 H1302 V420 H1350" class="edgeMuted"/><text x="1270" y="404" class="tiny">公开 URL</text>
  <path d="M794 440 H1046" class="edgeMuted"/><text x="878" y="425" class="tiny">状态 / 事件</text>
  <path d="M1170 359 V402" class="edgeMuted"/>
  <path d="M1170 518 V561" class="edgeMuted"/>

  <rect x="48" y="800" width="1504" height="150" rx="16" fill="#0a1424" stroke="#2a3b54" stroke-width="1.2"/>
  <text x="74" y="837" class="label">扩展新 Agent 时应保持的边界</text>
  <rect x="74" y="860" width="274" height="48" rx="24" class="pill"/><text x="211" y="891" text-anchor="middle" class="pillText">Skill 决定目标与可用 Tool，版本随 Run 固定</text>
  <rect x="374" y="860" width="286" height="48" rx="24" class="pill"/><text x="517" y="891" text-anchor="middle" class="pillText">外部副作用经过 Tool + 幂等记录 + Artifact</text>
  <rect x="686" y="860" width="286" height="48" rx="24" class="pill"/><text x="829" y="891" text-anchor="middle" class="pillText">费用或发布前设 Gate，前端只投影后端状态</text>
  <rect x="998" y="860" width="286" height="48" rx="24" class="pill"/><text x="1141" y="891" text-anchor="middle" class="pillText">新高并发需求须单独解决进程内队列边界</text>
  <text x="1518" y="991" text-anchor="end" class="tiny">源码快照：Sprint 153 · 2026-08-02</text>
</svg>
