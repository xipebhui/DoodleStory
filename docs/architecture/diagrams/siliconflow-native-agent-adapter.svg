<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 980">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#fbbf24"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .title { fill:#f8fafc; font-size:20px; font-weight:700; }
      .subtitle { fill:#94a3b8; font-size:10px; }
      .region-label { font-size:10px; font-weight:700; letter-spacing:1px; }
      .name { fill:#f8fafc; font-size:11px; font-weight:600; text-anchor:middle; }
      .desc { fill:#94a3b8; font-size:8.5px; text-anchor:middle; }
      .tiny { fill:#94a3b8; font-size:8px; }
      .arrow-label { fill:#cbd5e1; font-size:8px; text-anchor:middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="36" y="38" class="title">SiliconFlow Native Agent｜有界 Chat 路由适配架构</text>
  <text x="36" y="58" class="subtitle">目标：保持现有 Responses 路线不变，为 Paynes Creek S03 增加可审计、无隐式回退的 Run 级 Chat 路由</text>

  <!-- Regions -->
  <rect x="30" y="88" width="330" height="720" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="44" y="108" fill="#22d3ee" class="region-label">A｜RUN ADMISSION</text>

  <rect x="385" y="88" width="675" height="720" rx="12" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="399" y="108" fill="#34d399" class="region-label">B｜DURABLE RUNTIME + ADAPTER</text>

  <rect x="1085" y="88" width="365" height="720" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="1099" y="108" fill="#fbbf24" class="region-label">C｜EXTERNAL PROVIDERS</text>

  <!-- Connections behind boxes -->
  <path d="M195 188 L195 230" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M195 302 L195 344" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M195 416 L195 468" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M320 512 L430 512" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <path d="M555 468 L555 416" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M555 344 L555 302" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M680 266 L840 266" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M965 230 L965 188" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <path d="M680 380 L840 380" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <path d="M965 416 L965 468" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <path d="M840 380 L760 380 L760 672 L680 672" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <path d="M555 556 L555 620" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <path d="M680 266 L1125 266 L1125 188" fill="none" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M680 266 L1270 266 L1270 302" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M965 512 L1190 512 L1190 468" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M1320 512 L1320 584" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Run admission masks + boxes -->
  <rect x="70" y="126" width="250" height="62" rx="7" fill="#0f172a"/>
  <rect x="70" y="126" width="250" height="62" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="195" y="151" class="name">Run 创建请求</text>
  <text x="195" y="169" class="desc">可选 model_route；非默认 route 首版仅 Admin</text>

  <rect x="70" y="230" width="250" height="72" rx="7" fill="#0f172a"/>
  <rect x="70" y="230" width="250" height="72" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="195" y="255" class="name">Route Registry</text>
  <text x="195" y="273" class="desc">huomiao_responses</text>
  <text x="195" y="288" class="desc">siliconflow_chat_v1</text>

  <rect x="70" y="344" width="250" height="72" rx="7" fill="#0f172a"/>
  <rect x="70" y="344" width="250" height="72" rx="7" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="195" y="369" class="name">Capability Gate</text>
  <text x="195" y="387" class="desc">Chat V1 仅允许 S03 profile</text>
  <text x="195" y="402" class="desc">非法 Skill 明确失败；不回退默认路线</text>

  <rect x="70" y="468" width="250" height="88" rx="7" fill="#0f172a"/>
  <rect x="70" y="468" width="250" height="88" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="195" y="493" class="name">Run 路由快照</text>
  <text x="195" y="511" class="desc">route · provider · api_shape · model</text>
  <text x="195" y="526" class="desc">Follow-up 原样继承</text>
  <text x="195" y="541" class="desc">历史 Run 回填 huomiao / responses</text>

  <rect x="70" y="634" width="250" height="112" rx="7" fill="#0f172a"/>
  <rect x="70" y="634" width="250" height="112" rx="7" fill="rgba(30,41,59,0.7)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="195" y="658" class="name">配置隔离</text>
  <text x="195" y="679" class="desc">NATIVE_AGENT_DEFAULT_ROUTE</text>
  <text x="195" y="696" class="desc">NATIVE_AGENT_HUOMIAO_MODEL</text>
  <text x="195" y="713" class="desc">NATIVE_AGENT_SILICONFLOW_MODEL</text>
  <text x="195" y="731" class="desc">AGENT_MODEL 继续只服务旧 Router</text>

  <!-- Runtime boxes -->
  <rect x="430" y="468" width="250" height="88" rx="7" fill="#0f172a"/>
  <rect x="430" y="468" width="250" height="88" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="493" class="name">Provider Factory</text>
  <text x="555" y="511" class="desc">只读 Run 快照；环境仅提供凭据 / Base URL</text>
  <text x="555" y="529" class="desc">client retry=0 · Runner retry=0</text>
  <text x="555" y="544" class="desc">无 Provider fallback</text>

  <rect x="430" y="344" width="250" height="72" rx="7" fill="#0f172a"/>
  <rect x="430" y="344" width="250" height="72" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="555" y="369" class="name">Chat Message Preflight</text>
  <text x="555" y="387" class="desc">按 SDK 最终转换结果计数（含 system）</text>
  <text x="555" y="402" class="desc">≤10 放行；&gt;10 明确失败，不截断</text>

  <rect x="430" y="230" width="250" height="72" rx="7" fill="#0f172a"/>
  <rect x="430" y="230" width="250" height="72" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="555" y="255" class="name">Agents SDK Model</text>
  <text x="555" y="273" class="desc">Responses 或 Chat Completions</text>
  <text x="555" y="288" class="desc">Chat strict=true · buffer=false</text>

  <rect x="840" y="126" width="250" height="62" rx="7" fill="#0f172a"/>
  <rect x="840" y="126" width="250" height="62" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="965" y="151" class="name">SDK raw response.* events</text>
  <text x="965" y="169" class="desc">Chat Response / Item ID 可能全是 __fake_id__</text>

  <rect x="840" y="344" width="250" height="72" rx="7" fill="#0f172a"/>
  <rect x="840" y="344" width="250" height="72" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="965" y="369" class="name">NativeModelEventAdapter</text>
  <text x="965" y="387" class="desc">应用 model_call_id；output_index → call_id</text>
  <text x="965" y="402" class="desc">output_item.done 合成 arguments.done</text>

  <rect x="840" y="468" width="250" height="88" rx="7" fill="#0f172a"/>
  <rect x="840" y="468" width="250" height="88" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="965" y="493" class="name">Tool Output Policy</text>
  <text x="965" y="511" class="desc">Responses：文本 + 图片保持现状</text>
  <text x="965" y="528" class="desc">Chat：generate_image 只返 image_id 文本</text>
  <text x="965" y="544" class="desc">随后必须 inspect_image → 文本 verdict</text>

  <rect x="430" y="620" width="250" height="104" rx="7" fill="#0f172a"/>
  <rect x="430" y="620" width="250" height="104" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="555" y="646" class="name">Native Session / Step / Event</text>
  <text x="555" y="665" class="desc">完整输入重放 · Checkpoint · Tool 幂等</text>
  <text x="555" y="682" class="desc">provider · api shape · model · request ID</text>
  <text x="555" y="699" class="desc">usage · latency · execution attempt</text>
  <text x="555" y="715" class="desc">__fake_id__ 永不作为事实身份</text>

  <!-- External boxes -->
  <rect x="1125" y="126" width="280" height="62" rx="7" fill="#0f172a"/>
  <rect x="1125" y="126" width="280" height="62" rx="7" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1265" y="151" class="name">火苗 Responses</text>
  <text x="1265" y="169" class="desc">现有路线保持不变 · gpt-5.5</text>

  <rect x="1125" y="302" width="280" height="86" rx="7" fill="#0f172a"/>
  <rect x="1125" y="302" width="280" height="86" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1265" y="327" class="name">SiliconFlow Chat Completions</text>
  <text x="1265" y="345" class="desc">deepseek-ai/DeepSeek-V3.2</text>
  <text x="1265" y="362" class="desc">enable_thinking=false · 官方 tools</text>
  <text x="1265" y="378" class="desc">真实兼容性仍需零媒体 Gate</text>

  <rect x="1125" y="468" width="195" height="88" rx="7" fill="#0f172a"/>
  <rect x="1125" y="468" width="195" height="88" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1222" y="493" class="name">QY / Qwen-Image</text>
  <text x="1222" y="511" class="desc">只在 S03 媒体 Gate 调用</text>
  <text x="1222" y="528" class="desc">最多一张候选</text>
  <text x="1222" y="544" class="desc">失败即停</text>

  <rect x="1220" y="584" width="185" height="88" rx="7" fill="#0f172a"/>
  <rect x="1220" y="584" width="185" height="88" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1312" y="609" class="name">视觉检查 Provider</text>
  <text x="1312" y="627" class="desc">读取 image_id 对应资产</text>
  <text x="1312" y="644" class="desc">返回文本 verdict / score</text>
  <text x="1312" y="660" class="desc">Agent 不直接看图</text>

  <rect x="1125" y="714" width="280" height="62" rx="7" fill="#0f172a"/>
  <rect x="1125" y="714" width="280" height="62" rx="7" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1265" y="739" class="name">V1 禁止扩散</text>
  <text x="1265" y="757" class="desc">文章多 Agent · YouTube 看图 · 发布 · 其他 Skill</text>

  <!-- Arrow labels -->
  <text x="374" y="500" class="arrow-label">immutable snapshot</text>
  <text x="760" y="256" class="arrow-label">request</text>
  <text x="760" y="370" class="arrow-label">raw events</text>
  <text x="760" y="604" class="arrow-label" transform="rotate(-90 760 604)">normalized events</text>
  <text x="1190" y="254" class="arrow-label">route branch</text>
  <text x="1095" y="501" class="arrow-label">S03 only</text>

  <!-- Gate timeline -->
  <rect x="30" y="838" width="1420" height="108" rx="12" fill="rgba(30,41,59,0.6)" stroke="#475569" stroke-width="1.2"/>
  <text x="48" y="862" fill="#cbd5e1" class="region-label">DELIVERY GATES｜不能合并</text>

  <rect x="70" y="882" width="360" height="42" rx="21" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="250" y="907" class="name">A｜离线实现 + 迁移 + 聚焦测试</text>
  <path d="M430 903 L555 903" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="555" y="882" width="360" height="42" rx="21" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="735" y="907" class="name">B｜SiliconFlow 零媒体真实 Gate</text>
  <path d="M915 903 L1040 903" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="1040" y="882" width="360" height="42" rx="21" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1220" y="907" class="name">C｜一张 S03 → inspect → 人工审核</text>
</svg>
