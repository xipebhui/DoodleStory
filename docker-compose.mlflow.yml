services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    container_name: doodlestory-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - 127.0.0.1:*,localhost:*
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - doodlestory_mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

volumes:
  doodlestory_mlflow_data:
