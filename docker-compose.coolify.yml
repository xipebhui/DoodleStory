services:
  doodlestory:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /
    expose:
      - "8000"
    volumes:
      - doodlestory-data:/app/data
      - douyin-import-storage:/app/douyin-import-service/storage:ro
    depends_on:
      douyin-import-service:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/doodlestory.db
      DOODLESTORY_STORAGE_ROOT: /app/data/storage
      DOODLESTORY_FRONTEND_DIST: /app/frontend/dist
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      OBJECT_STORAGE_KEEP_LOCAL_MIRROR: ${OBJECT_STORAGE_KEEP_LOCAL_MIRROR:-false}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${ALIYUN_OSS_PUBLIC_BASE_URL:-}
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_BUCKET_DOMAIN: ${QINIU_BUCKET_DOMAIN:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-deepseek-ai/DeepSeek-V3.2}
      SILICONFLOW_VISION_MODEL: ${SILICONFLOW_VISION_MODEL:-Qwen/Qwen3-VL-32B-Instruct}
      SILICONFLOW_AUDIO_MODEL: ${SILICONFLOW_AUDIO_MODEL:-Qwen/Qwen3-Omni-30B-A3B-Instruct}
      LIO_API_KEY: ${LIO_API_KEY:-}
      LIO_BASE_URL: ${LIO_BASE_URL:-}
      LIO_MODEL: ${LIO_MODEL:-gemini-3.1-flash-lite-preview-thinking-minimal}
      TEXT_FALLBACK_API_KEY: ${TEXT_FALLBACK_API_KEY:-}
      TEXT_FALLBACK_BASE_URL: ${TEXT_FALLBACK_BASE_URL:-}
      TEXT_FALLBACK_MODEL: ${TEXT_FALLBACK_MODEL:-gpt-5.4}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-qy}
      IMAGE_GATEWAY_API_KEY: ${IMAGE_GATEWAY_API_KEY:-}
      IMAGE_GATEWAY_BASE_URL: ${IMAGE_GATEWAY_BASE_URL:-http://192.129.209.36:3001/v1}
      XG_BASE_URL: ${XG_BASE_URL:-https://api.xgapi.top}
      XG_API_KEY: ${XG_API_KEY:-}
      XG_IMAGE_QUALITY: ${XG_IMAGE_QUALITY:-1k}
      GROKCLI_HOME: /app/data/grokcli
      GROKCLI_IMAGE_MODEL: ${GROKCLI_IMAGE_MODEL:-grok-imagine-image-quality}
      GROKCLI_IMAGE_EDIT_MODEL: ${GROKCLI_IMAGE_EDIT_MODEL:-grok-imagine-image}
      GROKCLI_IMAGE_RESOLUTION: ${GROKCLI_IMAGE_RESOLUTION:-2k}
      GROKCLI_TIMEOUT_SECONDS: ${GROKCLI_TIMEOUT_SECONDS:-300}
      GROKCLI_REQUEST_MAX_ATTEMPTS: ${GROKCLI_REQUEST_MAX_ATTEMPTS:-2}
      GROKCLI_RETRY_BACKOFF_SECONDS: ${GROKCLI_RETRY_BACKOFF_SECONDS:-2}
      GROKCLI_VIDEO_MODEL: ${GROKCLI_VIDEO_MODEL:-grok-imagine-video-1.5}
      GROKCLI_VIDEO_RESOLUTION: ${GROKCLI_VIDEO_RESOLUTION:-720p}
      GROKCLI_VIDEO_TIMEOUT_SECONDS: ${GROKCLI_VIDEO_TIMEOUT_SECONDS:-660}
      DOUYIN_IMPORT_SERVICE_BASE_URL: http://douyin-import-service:8010
      COMIC_VIDEO_SERVICE_BASE_URL: ${COMIC_VIDEO_SERVICE_BASE_URL:-}
      COMIC_VIDEO_SERVICE_API_KEY: ${COMIC_VIDEO_SERVICE_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  douyin-import-service:
    build:
      context: ..
      dockerfile: douyin-import-service/Dockerfile
    expose:
      - "8010"
    volumes:
      - douyin-import-storage:/app/douyin-import-service/storage
      - douyin-import-cache:/app/douyin-import-service/.cache/douyin
    environment:
      DOUYIN_DOWNLOADER_ROOT: /app/douyin-downloader
      DOUYIN_DOWNLOADER_PYTHON: /usr/local/bin/python
      DOUYIN_COOKIE: ${DOUYIN_COOKIE:-}
      DOUYIN_COOKIE_FILE: /app/douyin-import-service/.cache/douyin/cookies.json
      DOUYIN_IMPORT_STORAGE_ROOT: /app/douyin-import-service/storage
      DOUYIN_DOWNLOAD_TIMEOUT_SECONDS: ${DOUYIN_DOWNLOAD_TIMEOUT_SECONDS:-180}
      WECHAT_CRAWLER_ROOT: /app/wechat-article-crawler
      WECHAT_CRAWLER_PYTHON: /opt/wechat-venv/bin/python
      YTB_DATA_API_V3_KEY: ${YTB_DATA_API_V3_KEY:-}
      YTB_DATA_API_TIMEOUT_SECONDS: ${YTB_DATA_API_TIMEOUT_SECONDS:-30}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  doodlestory-data:
  douyin-import-storage:
  douyin-import-cache:
